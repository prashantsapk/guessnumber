<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
</head>

<body>
    

    <h1>Number Guessing Game</h1>
    <span>Try and guess number from 1 to 100, You can have only 10 guess at a time </span><br><br>
    <form class="form1">
    <input type="text" id="number"><br><br>
    <span class="enter"></span><br>
    <span class="yourguess"></span><br>
    <span class="error"></span><br>
    <span class="won"></span><br>
    <p>Result : <span class="result"></span></p>
    <button type="submit">Guess</button>
    </form>
    


    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</body>

</html>
